<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logan's Creation Page!</title>
  <meta name="description" content="Everything Logan has made, in one place.">
  <style>
    :root {
      --bg: #f6f5fb;
      --surface: #ffffff;
      --text: #1d1b2e;
      --muted: #6b6882;
      --border: #e3e0f0;
      --accent: #6c4cf1;
      --accent-2: #f15bb5;
      --beta: #d97706;
      --beta-bg: #fef3c7;
      --released: #15803d;
      --released-bg: #dcfce7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12111c;
        --surface: #1c1a2b;
        --text: #f0eefb;
        --muted: #a29fba;
        --border: #2e2b45;
        --accent: #9b82ff;
        --accent-2: #ff7ac6;
        --beta: #fbbf24;
        --beta-bg: #3a2c0b;
        --released: #4ade80;
        --released-bg: #0f2e1a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      text-align: center;
      padding: 72px 0 48px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.15;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    section { margin-bottom: 48px; }

    .section-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 999px;
    }
    .badge.beta { color: var(--beta); background: var(--beta-bg); }
    .badge.released { color: var(--released); background: var(--released-bg); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(108, 76, 241, 0.15);
    }
    .card h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }

    .empty {
      padding: 28px 20px;
      text-align: center;
      color: var(--muted);
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: 14px;
    }

    main { padding-bottom: 48px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Logan's Creation Page!</h1>
      <p class="tagline">Everything I've made, all in one place.</p>
    </header>

    <main>
      <section id="beta" aria-labelledby="beta-title">
        <div class="section-head">
          <h2 id="beta-title">BETA</h2>
          <span class="badge beta">IN TESTING</span>
        </div>
        <div class="grid">
          <!-- Add a project by copying this card:
          <a class="card" href="https://example.com">
            <h3>Project name</h3>
            <p>Short description.</p>
          </a>
          -->
          <div class="empty">Nothing here yet. Check back soon!</div>
        </div>
      </section>

      <section id="released" aria-labelledby="released-title">
        <div class="section-head">
          <h2 id="released-title">RELEASED</h2>
          <span class="badge released">LIVE</span>
        </div>
        <div class="grid">
          <div class="empty">Nothing here yet. Check back soon!</div>
        </div>
      </section>
    </main>

  </div>
</body>
</html>
